<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Hineni School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="hebcal.min.js"></script>
<style>
:root{
  --bg:#f3eef6;--surface:#fff;--surface2:#faf6fc;
  --ink:#241826;--muted:#8d8298;--faint:#b7adc0;--line:#ece4f0;
  --brand:#b81e63;--brand2:#8c1149;--brand-soft:#fbe7f1;
  --ontime:#0fb481;--ontime-bg:#e6f8f1;
  --late:#f59331;--late-bg:#fdf0e2;
  --major:#e3164e;--major-bg:#fdeaef;
  --absent:#3c3744;--absent-bg:#eceaef;
  --excused:#b81e63;--excused-bg:#fbe7f1;
  --shadow-sm:0 1px 2px rgba(30,12,28,.05);
  --shadow:0 2px 6px rgba(30,12,28,.04),0 14px 30px -16px rgba(120,30,80,.22);
  --r:20px;--r-sm:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Fraunces",serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
img{display:block}
.app{max-width:600px;margin:0 auto;min-height:100dvh;position:relative}
/* header */
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:12px 15px;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr .brand{font-family:"Fraunces",serif;font-weight:700;font-size:19px;color:var(--brand);line-height:1;flex:none}
.hdr .brand .heb{color:var(--brand2);margin-inline-start:4px;opacity:.8}
.hdr .clock{font-size:11px;color:var(--muted);font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.hdr .sp{flex:1}
.hdr select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--brand2);background:var(--surface2);max-width:130px}
.iconbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--brand2);flex:none;transition:transform .1s}
.iconbtn:active{transform:scale(.93)}
/* nav + content */
.content{padding:15px 14px 120px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.bottomnav .inner{display:flex;width:100%;max-width:600px;justify-content:space-around}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;color:var(--faint);position:relative}
.navbtn svg{width:22px;height:22px}
.navbtn span{font-size:10px;font-weight:800}
.navbtn.on{color:var(--brand)}
.navbtn .dot{position:absolute;top:1px;right:calc(50% - 15px);width:8px;height:8px;border-radius:50%;background:var(--late);border:1.5px solid #fff}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);margin-bottom:13px}
.h-title{font-family:"Fraunces",serif;font-size:22px;font-weight:700;margin-bottom:2px}
.h-sub{font-size:13px;color:var(--muted);margin-bottom:13px}
.sec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:20px 3px 9px}
.muted{color:var(--muted)} .center{text-align:center}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:15px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 18px -8px rgba(184,30,99,.5);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--brand2);border:1.5px solid var(--line);box-shadow:none}
.btn.soft{background:var(--brand-soft);color:var(--brand2);box-shadow:none}
.btn.sm{width:auto;padding:9px 15px;font-size:14px;border-radius:12px}
.btn.tiny{width:auto;padding:6px 12px;font-size:12.5px;border-radius:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:13px;outline:none;background:var(--surface2);transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:#fff}
.listrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:background .12s}
.listrow:active{background:var(--surface2)}
.listrow .nm{font-weight:700;font-size:15px} .listrow .sub{font-size:12px;color:var(--muted);margin-top:1px}
.avatar{width:44px;height:44px;border-radius:13px;background:var(--brand-soft);flex:none;display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:15px;overflow:hidden;background-size:cover;background-position:center}
.avatar.lg{width:60px;height:60px;border-radius:17px;font-size:21px}
.chev{color:var(--faint);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:30px}
.p-pending{background:var(--late-bg);color:#b5670a} .p-approved{background:var(--ontime-bg);color:#0a8b64} .p-denied{background:var(--major-bg);color:var(--major)}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--brand-soft);color:var(--brand2)}
.empty{padding:44px 22px;text-align:center;color:var(--muted);line-height:1.6}
.empty .big{font-size:38px;margin-bottom:10px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:3px 12px;margin-bottom:11px;transition:border-color .15s}
.searchbox:focus-within{border-color:var(--brand)}
.searchbox input{flex:1;border:none;background:none;outline:none;padding:9px 0}
/* suggest card */
.suggest{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:var(--r);padding:14px 15px;margin-bottom:13px;box-shadow:0 12px 26px -10px rgba(140,17,73,.55)}
.suggest .t{flex:1} .suggest .t b{font-family:"Fraunces",serif;font-size:17px;display:block}
.suggest .t span{font-size:12px;opacity:.85;font-weight:600}
.suggest button{background:#fff;color:var(--brand2);font-weight:800;padding:9px 14px;border-radius:11px;font-size:13px;flex:none;white-space:nowrap}
/* mark grid */
.markbar{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.datepick{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 10px}
.datepick input{border:none;background:none;font-weight:700;font-size:13px;outline:none;padding:4px}
.toggle{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin:8px 0;font-weight:600;font-size:13px;cursor:pointer}
.toggle input{width:19px;height:19px;accent-color:var(--brand);flex:none}
.brush{display:flex;gap:5px;position:sticky;top:59px;z-index:30;padding:9px 0;background:linear-gradient(180deg,var(--bg) 70%,rgba(243,238,246,0))}
.brush button{flex:1;padding:10px 2px;border-radius:13px;font-weight:800;font-size:11.5px;border:2px solid var(--line);background:#fff;color:var(--ink);line-height:1.3}
.brush button:active{transform:scale(.95)}
.brush button[data-k=ontime].on{background:var(--ontime);border-color:var(--ontime);color:#fff}
.brush button[data-k=late].on{background:var(--late);border-color:var(--late);color:#fff}
.brush button[data-k=absent].on{background:var(--absent);border-color:var(--absent);color:#fff}
.brush button[data-k=excused].on{background:var(--excused);border-color:var(--excused);color:#fff}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-top:5px}
.seat{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:9px 6px 9px;text-align:center;box-shadow:var(--shadow-sm);transition:transform .07s,border-color .12s}
.seat:active{transform:scale(.95)}
.seat .face{width:56px;height:56px;border-radius:14px;margin:0 auto 6px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:18px;overflow:hidden;border:3px solid transparent;background-size:cover;background-position:center;transition:border-color .12s}
.seat.ontime{border-color:var(--ontime);background:var(--ontime-bg)} .seat.ontime .face{border-color:var(--ontime)}
.seat.late{border-color:var(--late);background:var(--late-bg)} .seat.late .face{border-color:var(--late)}
.seat.majorlate{border-color:var(--major);background:var(--major-bg)} .seat.majorlate .face{border-color:var(--major)}
.seat.absent{border-color:var(--absent);background:var(--absent-bg)} .seat.absent .face{border-color:var(--absent)}
.seat.excused{border-color:var(--excused);background:var(--excused-bg)} .seat.excused .face{border-color:var(--excused)}
.seat .snm{font-size:10.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ss{font-size:9.5px;font-weight:800;margin-top:2px;min-height:11px}
.seat .more{position:absolute;top:4px;left:5px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;color:var(--faint);font-size:14px;line-height:1}
.seat .ledot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--excused);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.22);display:none}
.seat.le .ledot{display:block}
/* batch roster selection */
.checkrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .1s,background .1s}
.checkrow.on{border-color:var(--brand);background:#fdf3f8}
.checkrow .cb{width:22px;height:22px;border-radius:8px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;transition:background .1s,border-color .1s}
.checkrow.on .cb{background:var(--brand);border-color:var(--brand)}
.addbar{position:sticky;bottom:80px;left:0;right:0;z-index:35;padding:8px 0 2px;background:linear-gradient(0deg,var(--bg) 60%,transparent)}
/* matrix report */
.matrix-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;box-shadow:var(--shadow);margin-bottom:13px}
.mx{display:grid;align-items:center;gap:0;min-width:max-content}
.mx-lab{position:sticky;left:0;background:var(--surface);z-index:2;display:flex;align-items:center;gap:7px;padding:4px 8px 4px 2px;font-size:11.5px;font-weight:700;line-height:1.1;min-width:110px;max-width:110px}
.mx-lab .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mx-wk{font-size:9px;font-weight:800;color:var(--brand2);text-align:center;padding:3px 1px;border-bottom:2px solid var(--brand-soft);white-space:nowrap;overflow:hidden;cursor:pointer}
.mx-dl{font-size:9px;color:var(--muted);text-align:center;line-height:1.2;padding:3px 0 5px;font-weight:700;min-width:34px}
.mx-cell{width:34px;height:32px;display:grid;place-items:center;position:relative}
.d5{width:18px;height:18px;border-radius:50%;position:relative;cursor:pointer;transition:transform .07s}
.d5:active{transform:scale(.88)}
.d5 .le{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--excused);border:1.5px solid #fff}
/* overall stat tiles */
.stats{display:flex;gap:7px}
.stat{flex:1;background:var(--surface2);border-radius:13px;padding:10px 3px;text-align:center}
.stat b{display:block;font-family:"Fraunces",serif;font-weight:700;font-size:20px;line-height:1.05}
.stat span{font-size:10px;font-weight:800;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:12px 0 4px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.legend .li i{width:11px;height:11px;border-radius:50%;flex:none}
.srow{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.srow b{font-weight:800}
.scorebar{height:8px;border-radius:5px;background:linear-gradient(90deg,#e3164e,#f59331,#0fb481);position:relative;margin:10px 0 4px}
.scorebar i{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:var(--ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(36,12,30,.44);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:600px;border-radius:26px 26px 0 0;padding:8px 17px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px)}}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .ssub{font-size:12.5px;color:var(--muted);line-height:1.45;margin-bottom:13px}
.sheet-actions{display:flex;gap:9px;align-items:center;margin-top:16px}
.statusset{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.statusset button{padding:13px 5px;border-radius:14px;font-weight:800;font-size:13.5px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .1s,background .1s}
.statusset button .d{width:11px;height:11px;border-radius:50%}
.statusset button.on{color:#fff}
.stepper{display:flex;align-items:center;background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;overflow:hidden}
.stepper button{width:46px;height:46px;font-size:22px;font-weight:700;color:var(--brand)}
.stepper .v{flex:1;text-align:center;font-weight:800;font-size:17px}
.stepper .u{font-size:11px;color:var(--muted);padding-inline-end:12px;font-weight:700}
.tabseg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px;margin:11px 0}
.tabseg button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);transition:background .12s,color .12s}
.tabseg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}
.linkbtn{font-size:12.5px;font-weight:800;color:var(--brand);padding:4px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#241826;color:#fff;padding:11px 18px;border-radius:30px;font-weight:600;font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;max-width:88%;text-align:center;pointer-events:none}
.toast.show{opacity:1}
.splash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.splash .mark{width:78px;height:78px;border-radius:24px;background:linear-gradient(150deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:38px;font-family:"Fraunces",serif;margin-bottom:20px;box-shadow:0 16px 34px -12px rgba(184,30,99,.55)}
</style>
</head>

<script>

const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5YnJwZWRzaHF6Y2tqc21wa3BsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTYwMDksImV4cCI6MjA5NjUzMjAwOX0.DMBPJ6kr7ViO0WN299MvX7P-4PTHWha1w6N-nD33u68";

let sb=null; try{ if(configured&&window.supabase) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ console.error(e); }

const HEB=(typeof Hebcal!=="undefined"&&Hebcal&&Hebcal.HDate)?Hebcal:null;
const _sed={}; function _sedra(y){ return _sed[y]||(_sed[y]=new HEB.Sedra(y,false)); }
function satKey(dateKey){ const d=parseKey(dateKey); d.setDate(d.getDate()+(6-d.getDay())); return dkey(d); }
function weekLabel(sat){ if(HEB){ try{ const h=new HEB.HDate(parseKey(sat)); const n=(_sedra(h.getFullYear()).lookup(h).parsha||[]); if(n.length) return n.join("–"); }catch(e){} } return "Wk "+parseKey(sat).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

/* classification + points */
function classify(m,t){ return m.status==="late"?((m.minutes_late||0)>=t?"major":"minor"):m.status; }
function counts5(marks,t){ const c={ontime:0,minor:0,major:0,absent:0,excused:0}; marks.forEach(m=>c[classify(m,t)]++); return c; }
function statusShow(status,mins,t){ if(status==="late"){ if((mins||0)>=t) return {label:"Major late",color:C5.major,cls:"majorlate"}; return {label:"Late "+mins+"m",color:C5.minor,cls:"late"}; } return {label:STATUS[status].label,color:C5[status==="ontime"?"ontime":status==="absent"?"absent":"excused"],cls:status}; }
function ptsOf(marks,sr){ let p=0; marks.forEach(m=>{ const cl=m.classes||{}; const on=Number(cl.pts_ontime??sr?.pts_ontime??0.1); const ab=Number(cl.pts_absent??sr?.pts_absent??-1); const pm=Number(cl.pts_per_min??sr?.pts_per_min??-0.011); if(m.status==="ontime")p+=on; else if(m.status==="absent")p+=ab; else if(m.status==="late")p+=pm*(m.minutes_late||0); }); return p; }
function fmtPts(p){ return (p>=0?"+":"")+(Math.round(p*100)/100); }
function scoreOf(c){ const tot=c.ontime+c.minor+c.major+c.absent; if(!tot) return null; return Math.round((c.ontime*100+c.minor*70+c.major*40)/tot); }

/* donut SVG */
function donutSVG(c,size){ size=size||120; const tot=K5.reduce((s,k)=>s+c[k],0); const cx=size/2,cy=size/2,r=size/2,hole=r*.58; if(!tot) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#eee"/><circle cx="${cx}" cy="${cy}" r="${hole}" fill="#fff"/></svg>`; let a=-Math.PI/2; const P=[]; K5.forEach(k=>{ if(!c[k])return; const sw=Math.min(c[k]/tot*2*Math.PI,2*Math.PI-.0001); const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a+sw),y2=cy+r*Math.sin(a+sw); P.push(`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r},0,${sw>Math.PI?1:0},1,${x2.toFixed(2)},${y2.toFixed(2)} L${cx},${cy} Z" fill="${C5[k]}"/>`); a+=sw; }); P.push(`<circle cx="${cx}" cy="${cy}" r="${hole}" fill="#fff"/>`); return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${P.join("")}</svg>`; }

/* time helpers */
function minsLateNow(cls){ if(!cls||!cls.start_time||view.date!==today()) return 0; const [h,m]=cls.start_time.split(":").map(Number); const st=new Date(); st.setHours(h,m,0,0); return Math.max(0,Math.round((Date.now()-st)/60000)); }
function relTime(cls){ if(!cls||!cls.start_time) return ""; const [h,m]=cls.start_time.split(":").map(Number); const st=new Date(); st.setHours(h,m,0,0); const d=Math.round((Date.now()-st)/60000); const f=n=>n<60?`${n}m`:`${Math.floor(n/60)}h ${n%60?n%60+"m":""}`.trim(); return d>=0?`started ${f(d)} ago`:`starts in ${f(-d)}`; }
function suggested(classes){ return (classes||[]).filter(x=>x.start_time).map(x=>{ const [h,m]=x.start_time.split(":").map(Number); const st=new Date(); st.setHours(h,m,0,0); return {cls:x,d:Math.round((Date.now()-st)/60000)}; }).filter(x=>x.d>=-25&&x.d<=180).sort((a,b)=>Math.abs(a.d)-Math.abs(b.d))[0]?.cls||null; }

function resizeImg(file,max=420,q=.82){ return new Promise(res=>{ const i=new Image(),u=URL.createObjectURL(file); i.onload=()=>{ const s=Math.min(1,max/Math.max(i.width,i.height)); const w=Math.round(i.width*s),h=Math.round(i.height*s); const cv=document.createElement("canvas"); cv.width=w;cv.height=h; cv.getContext("2d").drawImage(i,0,0,w,h); URL.revokeObjectURL(u); cv.toBlob(b=>res(b||file),"image/jpeg",q); }; i.onerror=()=>{ URL.revokeObjectURL(u); res(file); }; i.src=u; }); }
async function uploadFace(st,file){ const blob=await resizeImg(file); const path=`${st.school_id}/${st.id}.jpg`; const { error }=await sb.storage.from("faces").upload(path,blob,{ upsert:true, contentType:"image/jpeg" }); if(error) throw error; await sb.from("students").update({ photo_path:path }).eq("id",st.id); faceCache.delete(path); return path; }
async function faceUrl(path){ if(!path) return null; const c=faceCache.get(path); if(c&&c.exp>Date.now()) return c.url; const { data }=await sb.storage.from("faces").createSignedUrl(path,3600); if(!data) return null; faceCache.set(path,{url:data.signedUrl,exp:3500e3+Date.now()}); return data.signedUrl; }

function paintSeat(cell,status,mins,left){

  else { ss.style.color="var(--faint)"; ss.textContent="·"; }
  if(left) cell.classList.add("le");
}

function renderMatrix(c,marks,t,student,self){
  const dates=[...new Set(marks.map(m=>m.date))].sort((a,b)=>b.localeCompare(a)).slice(0,56);
  const clArr=[]; const seen={}; marks.forEach(m=>{ if(m.classes&&!seen[m.classes.id]){ seen[m.classes.id]=1; clArr.push(m.classes); } }); clArr.sort((a,b)=>a.name.localeCompare(b.name));
  const byKey={}; marks.forEach(m=>{ if(m.classes) byKey[m.classes.id+"|"+m.date]=m; });
  /* week grouping */
  const wkArr=[]; let i=0; while(i<dates.length){ const wk=satKey(dates[i]); let j=i; while(j<dates.length&&satKey(dates[j])===wk)j++; wkArr.push({sat:wk,from:i,to:j,dateSet:new Set(dates.slice(i,j))}); i=j; }
  const wrap=el("div","matrix-wrap"); const mx=el("div","mx"); mx.style.gridTemplateColumns=`112px repeat(${dates.length},34px)`;
  /* row: week labels */
  mx.appendChild(el("div","mx-lab",""));
  wkArr.forEach(w=>{ const cell=el("div","mx-wk",esc(weekLabel(w.sat))); cell.style.gridColumn=`span ${w.to-w.from}`; cell.title=weekLabel(w.sat); cell.onclick=()=>openBreakdown(weekLabel(w.sat),marks.filter(m=>w.dateSet.has(m.date)),t); mx.appendChild(cell); });
  /* row: date labels */
  mx.appendChild(el("div","mx-lab",""));
  dates.forEach(d=>mx.appendChild(el("div","mx-dl",fmtShort(d))));
  /* class rows */
  clArr.forEach(cl=>{ const clMarks=marks.filter(m=>m.classes&&m.classes.id===cl.id);
    const lab=el("div","mx-lab"); lab.style.cursor="pointer"; lab.innerHTML=`<span style="flex:none">${donutSVG(counts5(clMarks,t),26)}</span><span class="nm2">${esc(cl.name)}</span>`; lab.onclick=()=>openBreakdown(cl.name,clMarks,t); mx.appendChild(lab);
    dates.forEach(d=>{ const m=byKey[cl.id+"|"+d]; const dc=el("div","mx-cell");
      if(m){ const k=classify(m,t); const dot=el("div","d5"); dot.style.background=C5[k]; dot.style.cursor="pointer"; if(m.left_early) dot.insertAdjacentHTML("beforeend",'<i class="le"></i>'); dc.appendChild(dot); dc.onclick=()=>openMarkInfo(m,student,self,t); }

  });
  wrap.appendChild(mx); c.appendChild(wrap);
  const lg=el("div","legend"); K5.forEach(k=>lg.insertAdjacentHTML("beforeend",`<div class="li"><i style="background:${C5[k]}"></i>${L5[k]}</div>`)); lg.insertAdjacentHTML("beforeend",`<div class="li"><i style="background:var(--excused);outline:2px solid #fff;outline-offset:-4px;border-radius:50%"></i>Left early dot</div>`); c.appendChild(lg);
}

}
function appealCard(a,actionable){ const mk=a.marks||{}; const cls=(mk.classes&&mk.classes.name)||"Class"; const who=(mk.students&&mk.students.full_name)||"Student";
  const card=el("div","card"); card.innerHTML=`<div class="row" style="justify-content:space-between;gap:8px"><div><div style="font-weight:800;font-size:15px">${esc(who)}</div><div class="sub muted" style="font-size:12px">${esc(cls)} · ${mk.date?fmtDate(mk.date):""}</div></div><span class="pill p-${a.status}">${a.status}</span></div><div style="margin-top:8px"><span class="tag">marked: ${mk.status?STATUS[mk.status].label:"—"}</span></div><div style="background:var(--surface2);border-radius:13px;padding:11px;font-size:13.5px;line-height:1.45;margin-top:8px">${esc(a.message||"(no reason given)")}</div>`;
  if(a.response) card.insertAdjacentHTML("beforeend",`<div style="font-size:13px;margin-top:7px;background:var(--brand-soft);border-radius:12px;padding:10px"><b>Your reply:</b> ${esc(a.response)}</div>`);
  const A=el("div","sheet-actions"); const sp=el("div"); sp.style.flex="1"; A.appendChild(sp);
  if(actionable){ const deny=el("button","btn ghost sm","Deny"); deny.onclick=()=>openResolve(a,"denied"); const ok=el("button","btn sm","Approve & fix"); ok.onclick=()=>openResolve(a,"approved"); A.append(deny,ok); }
  else { const ch=el("button","btn ghost sm","Change decision"); ch.onclick=()=>openResolve(a,a.status==="approved"?"denied":"approved"); A.appendChild(ch); }
  card.appendChild(A); return card;
}
function openResolve(a,decision){ openSheet(sh=>{ const mk=a.marks||{}; sh.appendChild(el("h3",null,decision==="approved"?"Approve appeal":"Deny appeal")); let ns=mk.status;
  if(decision==="approved"){ sh.appendChild(el("div","field",`<label>Change the mark to</label>`)); const set=el("div","statusset"); SKEYS.forEach(k=>{ const b=el("button",ns===k?"on":"",`<span class="d" style="background:${STATUS[k].c}"></span>${STATUS[k].label}`); if(ns===k){b.style.background=STATUS[k].c;b.style.borderColor=STATUS[k].c;} b.onclick=()=>{ ns=k; set.querySelectorAll("button").forEach(x=>{x.classList.remove("on");x.style.background="";x.style.borderColor="";}); b.classList.add("on"); b.style.background=STATUS[k].c; b.style.borderColor=STATUS[k].c; }; set.appendChild(b); }); sh.appendChild(set); }
  const fr=el("div","field"); fr.style.marginTop="12px"; fr.innerHTML=`<label>Note to student (optional)</label>`; const ta=el("textarea"); ta.rows=2; ta.value=a.response||""; ta.style.cssText="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface2)"; fr.appendChild(ta); sh.appendChild(fr);
  sheetActions(sh,decision==="approved"?"Approve":"Deny",async()=>{ const { error }=await resolveAppeal(a,decision,ta.value.trim(),ns); if(error){ toast(error.message); return; } closeSheet(); toast(decision==="approved"?"Approved & fixed":"Denied"); refreshPending(); renderContent(); }); });
}

/* BOOT */
async function boot(){ 
  if(!configured){ configNeeded(); return; }
  if(!sb){ app().innerHTML=`<div class="splash"><div class="mark">⚠️</div><h2>Couldn't connect</h2><p class="muted" style="max-width:320px;line-height:1.55">The Supabase library didn't load. Check your connection and reload.</p></div>`; return; }
  app().innerHTML=`<div class="splash"><div class="mark">ה</div><p class="muted" style="margin-top:12px">Loading…</p></div>`;
  try{
    me_=await loadMe();
    if(me_){ if(me_.role==="admin"){ schoolsCache=await listSchools(); view.school=view.school||me_.school_id||schoolsCache[0]?.id; } await loadSchoolRow(); if(me_.role!=="student") await refreshPending(); buildShell(); renderContent(); }
    else renderLogin();
    sb.auth.onAuthStateChange(async(_e,session)=>{ const had=!!me_; me_=session?await loadMe():null;
      if(me_){ if(me_.role==="admin"){ schoolsCache=await listSchools(); view.school=view.school||me_.school_id||schoolsCache[0]?.id; } await loadSchoolRow(); if(me_.role!=="student") await refreshPending(); if(!had||!$("#content")){ view={tab:null,classId:null,studentId:null,sub:"mark",date:today(),brush:"ontime",school:view.school}; buildShell(); renderContent(); } }
      else if(had) renderLogin(); });
  }catch(e){ console.error(e); app().innerHTML=`<div class="splash"><div class="mark">⚠️</div><h2>Something went wrong</h2><p class="muted" style="max-width:320px;line-height:1.55">${esc(e.message||String(e))}<br><br>Make sure you ran all the SQL update files in Supabase.</p><button class="btn" style="max-width:200px;margin-top:18px" onclick="location.reload()">Try again</button></div>`; }
}
boot();
</script>
