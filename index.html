<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hineni School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --brand:#a51c66; --brand-dark:#7c1450; --brand-light:#c83f87;
    --ontime:#15c79a; --late:#f5731f; --absent:#1b1b22; --excused:#a51c66;
    --ink:#33222c; --muted:#8a7682; --line:#f0d9e6; --bg:#fff6fb; --card:#fff;
    --r:18px; --shadow:0 10px 30px -12px rgba(124,20,80,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0,#fff 0,var(--bg) 60%);min-height:100dvh}
  .app{max-width:560px;margin:0 auto;padding:0 0 90px}
  h1,h2,h3,h4{font-family:"Fraunces",serif;margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:16px}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:14px 16px;background:rgba(255,246,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar .logo{font-family:"Fraunces",serif;font-weight:700;font-size:20px;color:var(--brand-dark)}
  .topbar .logo small{display:block;font-family:"Hanken Grotesk";font-weight:600;font-size:10px;color:var(--brand-light);letter-spacing:.12em;text-transform:uppercase}
  .topbar .sp{flex:1}
  .badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:#fbe9f3;color:var(--brand-dark);text-transform:capitalize}
  .icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--brand-dark)}
  .wrap{padding:16px}
  .tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:9px 15px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);background:#fff;border:1px solid var(--line);white-space:nowrap}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px}
  .btn{width:100%;padding:14px;border-radius:13px;font-weight:700;font-size:15px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.ghost{background:#fff;color:var(--brand-dark);border:1.5px solid var(--line)}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:#fff}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand-light)}
  .muted{color:var(--muted)} .center{text-align:center}
  .sec{font-family:"Fraunces",serif;font-weight:600;font-size:15px;color:var(--brand-dark);margin:18px 2px 10px}
  .listrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
  .listrow .nm{font-weight:700} .listrow .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#f3dfeb;flex:none;display:grid;place-items:center;color:var(--brand-light);font-weight:800;font-size:16px;overflow:hidden}
  /* marking grid */
  .brush{display:flex;gap:7px;margin:4px 0 14px;position:sticky;top:64px;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:6px 0}
  .brush button{flex:1;padding:11px 4px;border-radius:12px;font-weight:800;font-size:13px;border:2px solid transparent;background:#fff;box-shadow:0 2px 8px rgba(124,20,80,.08);color:var(--ink)}
  .brush button.on{color:#fff}
  .b-ontime.on{background:var(--ontime);border-color:var(--ontime)} .b-late.on{background:var(--late);border-color:var(--late)}
  .b-absent.on{background:var(--absent);border-color:var(--absent)} .b-excused.on{background:var(--excused);border-color:var(--excused)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
  .seat{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 6px 9px;text-align:center;box-shadow:0 3px 10px -6px rgba(124,20,80,.3)}
  .seat .face{width:58px;height:58px;border-radius:50%;object-fit:cover;margin:0 auto 6px;background:#f3dfeb;display:grid;place-items:center;color:var(--brand-light);font-weight:800;font-size:20px;overflow:hidden;border:3px solid #eee}
  .seat.ontime .face{border-color:var(--ontime)} .seat.late .face{border-color:var(--late)}
  .seat.absent .face{border-color:var(--absent)} .seat.excused .face{border-color:var(--excused)}
  .seat .snm{font-size:11.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .ss{font-size:10px;font-weight:700;margin-top:2px;height:12px}
  .seat .dots{position:absolute;top:5px;right:6px;font-size:14px;color:var(--muted);line-height:1}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(40,10,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h3{font-size:19px;margin-bottom:14px}
  .sheet-actions{display:flex;gap:10px;align-items:center;margin-top:18px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
  .p-pending{background:#fff3e6;color:#b5530a}.p-approved{background:#e3f9f1;color:#0f876a}.p-denied{background:#fde7ee;color:#c11447}
  .statusset{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .statusset button{flex:1;min-width:70px;padding:12px 6px;border-radius:12px;font-weight:700;font-size:13px;border:2px solid var(--line);background:#fff}
  .statusset button.on{color:#fff}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a0a1c;color:#fff;padding:11px 18px;border-radius:30px;font-weight:600;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;max-width:90%}
  .toast.show{opacity:1}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);line-height:1.5}
  .splash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
  .splash .mark{width:74px;height:74px;border-radius:22px;background:linear-gradient(150deg,var(--brand-light),var(--brand-dark));display:grid;place-items:center;color:#fff;font-size:36px;font-family:"Fraunces",serif;margin-bottom:18px;box-shadow:var(--shadow)}
  a{color:var(--brand)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
"use strict";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5YnJwZWRzaHF6Y2tqc21wa3BsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTYwMDksImV4cCI6MjA5NjUzMjAwOX0.DMBPJ6kr7ViO0WN299MvX7P-4PTHWha1w6N-nD33u68;"

/* ---------- setup ---------- */
const configured = !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");
let sb = null;
try {

  }

const STATUS = {
  ontime:{label:"On time",color:"var(--ontime)"},
  late:{label:"Late",color:"var(--late)"},
  absent:{label:"Absent",color:"var(--absent)"},
  excused:{label:"Excused",color:"var(--excused)"}
};
const STATUS_KEYS = ["ontime","late","absent","excused"];

let me_ = null;          // my profile {id, role, school_id, full_name}
let view = {tab:null, classId:null, sub:"mark", date:todayKey()};
const faceCache = new Map();

/* ---------- tiny DOM helpers ---------- */
const $ = s => document.querySelector(s);
const app = () => $("#app");
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDate(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function initials(name){ const p=(name||"").trim().split(/\s+/); return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase(); }
let toastT;
function toast(msg){ let t=$("#toast"); if(!t){ t=el("div","toast"); t.id="toast"; document.body.appendChild(t); } t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }
function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }

/* ---------- sheet ---------- */
function openSheet(build){
  closeSheet();
  const scrim=el("div","scrim"); scrim.id="scrim";
  const sheet=el("div","sheet");
  scrim.onclick=e=>{ if(e.target===scrim) closeSheet(); };
  build(sheet); scrim.appendChild(sheet); document.body.appendChild(scrim);
}
function closeSheet(){ const s=$("#scrim"); if(s) s.remove(); }

/* ===================================================================
   DATA LAYER
   =================================================================== */
async function loadMe(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return null;
  let { data } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if(!data){ // profile row may lag right after first sign-in
    await new Promise(r=>setTimeout(r,800));
    ({ data } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle());
  }
  return data;
}
const Q = {
  classes: () => sb.from("classes").select("*").order("name"),
  students: () => sb.from("students").select("*").order("full_name"),
  people: () => sb.from("profiles").select("*").order("full_name"),
  enrollments: (cid) => sb.from("enrollments").select("*, students(*)").eq("class_id", cid).order("sort_order"),
  marksFor: (cid, date) => sb.from("marks").select("*").eq("class_id", cid).eq("date", date),
  myStudentRow: () => sb.from("students").select("*").eq("profile_id", me_.id).maybeSingle(),
};
async function createClass(name, teacherId){
  return sb.from("classes").insert({ name, teacher_id: teacherId||me_.id, school_id: me_.school_id });
}
async function createStudent(name, email){
  const { data, error } = await sb.from("students")
    .insert({ full_name:name, email:email||null, school_id: me_.school_id, created_by: me_.id })
    .select().single();
  if(error) throw error; return data;
}
async function enroll(classId, studentId, order){
  return sb.from("enrollments").insert({ class_id:classId, student_id:studentId, sort_order:order||0 });
}
async function unenroll(classId, studentId){
  return sb.from("enrollments").delete().eq("class_id",classId).eq("student_id",studentId);
}
async function setMark(classId, studentId, date, status, minutes, leftEarly){
  return sb.from("marks").upsert(
    { class_id:classId, student_id:studentId, date, status, minutes_late:minutes||0, left_early:!!leftEarly, marked_by: me_.id },
    { onConflict:"class_id,student_id,date" }
  );
}
async function setRole(profileId, role){ return sb.from("profiles").update({ role, school_id: me_.school_id }).eq("id", profileId); }
async function createAppeal(markId, studentId, message){
  return sb.from("appeals").insert({ mark_id:markId, student_id:studentId, message });
}
async function resolveAppeal(appeal, status, response, newStatus){
  if(status==="approved" && newStatus){
    await sb.from("marks").update({ status:newStatus }).eq("id", appeal.mark_id);
  }
  return sb.from("appeals").update({ status, response:response||"", resolved_by:me_.id, resolved_at:new Date().toISOString() }).eq("id", appeal.id);
}
async function listAppeals(){
  return sb.from("appeals").select("*, marks(*, classes(name), students(full_name))").order("created_at",{ascending:false});
}

/* photos */
function resizeImage(file, max=420, q=0.82){
  return new Promise(resolve=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      cv.toBlob(b=>resolve(b||file),"image/jpeg",q); };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}
async function uploadFace(student, file){
  const blob = await resizeImage(file);
  const path = `${student.school_id}/${student.id}.jpg`;
  const { error } = await sb.storage.from("faces").upload(path, blob, { upsert:true, contentType:"image/jpeg" });
  if(error) throw error;
  await sb.from("students").update({ photo_path: path }).eq("id", student.id);
  faceCache.delete(path);
  return path;
}
async function faceUrl(path){
  if(!path) return null;
  const c=faceCache.get(path); if(c && c.exp>Date.now()) return c.url;
  const { data } = await sb.storage.from("faces").createSignedUrl(path, 3600);
  if(!data) return null;
  faceCache.set(path, { url:data.signedUrl, exp:Date.now()+3500*1000 });
  return data.signedUrl;
}
function fillFace(imgEl, path, name){
  imgEl.textContent = initials(name);
  if(path) faceUrl(path).then(u=>{ if(u){ const im=new Image(); im.onload=()=>{ imgEl.textContent=""; imgEl.style.backgroundImage=`url(${u})`; imgEl.style.backgroundSize="cover"; imgEl.style.backgroundPosition="center"; }; im.src=u; } });
}

/* ===================================================================
   AUTH SCREENS
   =================================================================== */
function renderConfigNeeded(){
  app().innerHTML = `<div class="splash">
    <div class="mark">ה</div>
    <h2 style="color:var(--brand-dark)">Almost there</h2>
    <p class="muted" style="max-width:340px;margin-top:10px;line-height:1.55">
      This app needs to be connected to your Supabase project. Open the app file and paste your
      <b>Project URL</b> and <b>anon key</b> into the CONFIG section at the top, then re-upload. See <b>SETUP.md</b>.</p>
  </div>`;
}
function renderLogin(){
  app().innerHTML = "";
  const s=el("div","splash");
  s.innerHTML = `<div class="mark">ה</div>
    <h1 style="color:var(--brand-dark);font-size:30px">Hineni</h1>
    <div class="muted" style="letter-spacing:.14em;font-weight:700;font-size:11px;text-transform:uppercase;margin-top:4px">School Attendance</div>
    <p class="muted" style="margin:16px 0 22px;max-width:320px;line-height:1.5">Sign in with your email — we'll send you a one-tap login link. No password to remember.</p>`;
  const card=el("div","card"); card.style.maxWidth="360px"; card.style.width="100%";
  const f=el("div","field"); f.innerHTML=`<label>Email address</label>`;
  const inp=el("input"); inp.type="email"; inp.placeholder="you@example.com"; inp.autocomplete="email"; f.appendChild(inp);
  const btn=el("button","btn","Send me a login link");
  btn.onclick=async()=>{
    const email=inp.value.trim(); if(!email){ toast("Enter your email"); return; }
    btn.textContent="Sending…"; btn.disabled=true;
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.href.split("#")[0] } });
    btn.disabled=false; btn.textContent="Send me a login link";
    if(error){ toast(error.message); return; }
    card.innerHTML = `<div class="center" style="padding:8px 4px">
      <div style="font-size:34px">📬</div>
      <h3 style="margin:10px 0 6px">Check your email</h3>
      <p class="muted" style="line-height:1.5">We sent a login link to <b>${esc(email)}</b>. Tap it on this device to sign in.</p></div>`;
  };
  card.append(f, btn); s.appendChild(card); app().appendChild(s);
}

/* ===================================================================
   SHELL
   =================================================================== */
function topbar(){
  const t=el("div","topbar");
  t.innerHTML = `<div class="logo">Hineni<small>School</small></div><div class="sp"></div>
    <span class="badge">${esc(me_.role)}</span>`;
  const out=el("button","icon-btn"); out.title="Sign out";
  out.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>`;
  out.onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  t.appendChild(out);
  return t;
}
function tabsBar(items){
  const bar=el("div","tabs");
  items.forEach(([k,label])=>{ const b=el("button","tab"+(view.tab===k?" on":""),label); b.onclick=()=>{ view.tab=k; view.classId=null; render(); }; bar.appendChild(b); });
  return bar;
}

async function render(){
  if(!configured){ renderConfigNeeded(); return; }
  if(!me_){ renderLogin(); return; }

  // student has no role tabs — single screen
  app().innerHTML="";
  app().appendChild(topbar());

  if(me_.role==="student"){ await renderStudentHome(); return; }

  const tabs = me_.role==="principal"
    ? [["classes","Classes"],["students","Students"],["people","People"],["appeals","Appeals"]]
    : [["classes","My Classes"],["appeals","Appeals"]];
  if(!view.tab) view.tab="classes";
  app().appendChild(tabsBar(tabs));

  const wrap=el("div","wrap"); app().appendChild(wrap);
  if(view.classId){ await renderClassDetail(wrap); return; }
  if(view.tab==="classes")  await renderClasses(wrap);
  else if(view.tab==="students") await renderStudents(wrap);
  else if(view.tab==="people")   await renderPeople(wrap);
  else if(view.tab==="appeals")  await renderAppeals(wrap);
}

/* ===================================================================
   CLASSES
   =================================================================== */
async function renderClasses(wrap){
  const add=el("button","btn","＋ New class"); add.onclick=openClassForm; wrap.appendChild(add);
  const { data:classes, error } = await Q.classes();
  if(error){ wrap.appendChild(el("div","empty",esc(error.message))); return; }
  if(!classes.length){ wrap.appendChild(el("div","empty","No classes yet.<br>Create one to start marking.")); return; }
  wrap.appendChild(el("div","sec","Classes"));
  for(const c of classes){
    const { count } = await sb.from("enrollments").select("*",{count:"exact",head:true}).eq("class_id",c.id);
    const row=el("div","listrow"); row.style.cursor="pointer";
    row.innerHTML=`<div class="avatar">${esc(c.name[0]||"?")}</div>
      <div style="flex:1"><div class="nm">${esc(c.name)}</div><div class="sub">${count||0} students</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9b3c2" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>`;
    row.onclick=()=>{ view.classId=c.id; view.sub="mark"; render(); };
    wrap.appendChild(row);
  }
}
function openClassForm(){
  openSheet(async sh=>{
    sh.appendChild(el("h3",null,"New class"));
    const fn=el("div","field"); fn.innerHTML=`<label>Class name</label>`; const nm=el("input"); nm.placeholder="e.g. Nigleh A"; fn.appendChild(nm); sh.appendChild(fn);
    let teacherSel=null;
    if(me_.role==="principal"){
      const { data:people } = await Q.people();
      const teachers=(people||[]).filter(p=>p.role==="teacher"||p.role==="principal");
      const ft=el("div","field"); ft.innerHTML=`<label>Teacher</label>`; teacherSel=el("select");
      teachers.forEach(t=>{ const o=el("option"); o.value=t.id; o.textContent=(t.full_name||t.email||"User")+(t.id===me_.id?" (you)":""); if(t.id===me_.id)o.selected=true; teacherSel.appendChild(o); });
      ft.appendChild(teacherSel); sh.appendChild(ft);
    }
    const A=el("div","sheet-actions"); const sp=el("div"); sp.style.flex="1";
    const cn=el("button","btn ghost sm","Cancel"); cn.onclick=closeSheet;
    const sv=el("button","btn sm","Create");
    sv.onclick=async()=>{ if(!nm.value.trim()){ toast("Name it"); return; }
      const { error }=await createClass(nm.value.trim(), teacherSel?teacherSel.value:me_.id);
      if(error){ toast(error.message); return; } closeSheet(); toast("Class created"); render(); };
    A.append(sp,cn,sv); sh.appendChild(A);
  });
}

/* ===================================================================
   CLASS DETAIL — Mark grid + Roster
   =================================================================== */
async function renderClassDetail(wrap){
  const { data:cls } = await sb.from("classes").select("*").eq("id",view.classId).single();
  const back=el("button","btn ghost sm","‹ Back"); back.style.marginBottom="12px"; back.onclick=()=>{ view.classId=null; render(); }; wrap.appendChild(back);
  const head=el("div"); head.innerHTML=`<h2 style="color:var(--brand-dark)">${esc(cls.name)}</h2>`; wrap.appendChild(head);
  const sub=el("div","tabs"); sub.style.padding="12px 0 4px";
  [["mark","Mark"],["roster","Roster"]].forEach(([k,l])=>{ const b=el("button","tab"+(view.sub===k?" on":""),l); b.onclick=()=>{ view.sub=k; render(); }; sub.appendChild(b); });
  wrap.appendChild(sub);
  if(view.sub==="mark") await renderMarkGrid(wrap, cls);
  else await renderRoster(wrap, cls);
}

async function renderMarkGrid(wrap, cls){
  // date picker
  const df=el("div","field"); df.style.margin="14px 0 4px"; df.innerHTML=`<label>Date</label>`;
  const di=el("input"); di.type="date"; di.value=view.date; di.onchange=()=>{ view.date=di.value; render(); }; df.appendChild(di); wrap.appendChild(df);

  const { data:enr } = await Q.enrollments(cls.id);
  if(!enr || !enr.length){ wrap.appendChild(el("div","empty","No students in this class yet.<br>Go to <b>Roster</b> to add them.")); return; }
  const { data:marks } = await Q.marksFor(cls.id, view.date);
  const markMap={}; (marks||[]).forEach(m=>markMap[m.student_id]=m);

  // brush
  if(!view.brush) view.brush="ontime";
  const brush=el("div","brush");
  STATUS_KEYS.forEach(k=>{ const b=el("button","b-"+k+(view.brush===k?" on":""),STATUS[k].label); b.onclick=()=>{ view.brush=k; render(); }; brush.appendChild(b); });
  wrap.appendChild(brush);

  const allBtn=el("button","btn ghost sm","✓ Mark everyone on time"); allBtn.style.marginBottom="12px";
  allBtn.onclick=async()=>{ for(const e of enr){ if(!markMap[e.student_id]) await setMark(cls.id,e.student_id,view.date,"ontime",0,false); } buzz(); toast("Marked present"); render(); };
  wrap.appendChild(allBtn);

  const grid=el("div","grid");
  enr.forEach(e=>{
    const st=e.students; const m=markMap[st.id];
    const cell=el("div","seat"+(m?" "+m.status:""));
    const face=el("div","face"); fillFace(face, st.photo_path, st.full_name);
    const nm=el("div","snm",esc(st.full_name||"—"));
    const ss=el("div","ss"); ss.style.color=m?STATUS[m.status].color:"transparent"; ss.textContent=m?(STATUS[m.status].label+(m.minutes_late?` ${m.minutes_late}m`:"")):"·";
    const dots=el("button","dots","⋯"); dots.onclick=(ev)=>{ ev.stopPropagation(); openMarkDetail(cls,st,m); };
    cell.append(dots,face,nm,ss);
    cell.onclick=async()=>{ await setMark(cls.id,st.id,view.date,view.brush,0,false); buzz(); render(); };
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);
  const tip=el("div","muted center"); tip.style.cssText="font-size:12px;margin-top:14px;line-height:1.5";
  tip.innerHTML=`Pick a status above, then tap faces to mark them.<br>Tap ⋯ on a student for minutes-late or “left early”.`;
  wrap.appendChild(tip);
}
function openMarkDetail(cls, st, m){
  openSheet(sh=>{
    sh.appendChild(el("h3",null,esc(st.full_name||"Student")));
    let status=(m&&m.status)||"ontime", mins=(m&&m.minutes_late)||0, left=(m&&m.left_early)||false;
    const set=el("div","statusset");
    const minField=el("div","field"); minField.style.display=(status==="late")?"block":"none";
    minField.innerHTML=`<label>Minutes late</label>`; const minInp=el("input"); minInp.type="number"; minInp.min=0; minInp.value=mins; minField.appendChild(minInp);
    STATUS_KEYS.forEach(k=>{ const b=el("button",(status===k?"on":""),STATUS[k].label); if(status===k)b.style.background=STATUS[k].color,b.style.borderColor=STATUS[k].color;
      b.onclick=()=>{ status=k; [...set.children].forEach(c=>{c.className="";c.style.background="";c.style.borderColor="";}); b.className="on"; b.style.background=STATUS[k].color; b.style.borderColor=STATUS[k].color; minField.style.display=(k==="late")?"block":"none"; };
      set.appendChild(b); });
    sh.appendChild(el("div","field",`<label>Status</label>`)).appendChild(set);
    sh.appendChild(minField);
    const lf=el("label"); lf.style.cssText="display:flex;align-items:center;gap:10px;margin:6px 0;font-weight:600";
    const cb=el("input"); cb.type="checkbox"; cb.checked=left; cb.style.cssText="width:18px;height:18px;accent-color:var(--brand)";
    lf.append(cb, document.createTextNode("Left early")); sh.appendChild(lf);
    const A=el("div","sheet-actions"); const sp=el("div"); sp.style.flex="1";
    const cn=el("button","btn ghost sm","Cancel"); cn.onclick=closeSheet;
    const sv=el("button","btn sm","Save");
    sv.onclick=async()=>{ await setMark(cls.id,st.id,view.date,status,parseInt(minInp.value)||0,cb.checked); buzz(); closeSheet(); render(); };
    A.append(sp,cn,sv); sh.appendChild(A);
  });
}

async function renderRoster(wrap, cls){
  const addNew=el("button","btn","＋ Add a new student"); addNew.style.marginTop="14px";
  addNew.onclick=()=>openStudentForm(cls); wrap.appendChild(addNew);

  const { data:enr } = await Q.enrollments(cls.id);
  const enrolledIds=new Set((enr||[]).map(e=>e.student_id));

  wrap.appendChild(el("div","sec","In this class ("+(enr?enr.length:0)+")"));
  if(enr && enr.length){
    enr.forEach((e,i)=>{ const st=e.students; const row=el("div","listrow");
      const av=el("div","avatar"); fillFace(av, st.photo_path, st.full_name);
      const body=el("div"); body.style.flex="1"; body.innerHTML=`<div class="nm">${esc(st.full_name||"(no name yet)")}</div><div class="sub">${st.photo_path?"has photo":"no photo"}</div>`;
      const cam=el("button","btn ghost sm","📷"); cam.onclick=()=>pickFace(st);
      const rm=el("button","btn ghost sm","Remove"); rm.onclick=async()=>{ await unenroll(cls.id,st.id); render(); };
      row.append(av,body,cam,rm); wrap.appendChild(row);
    });
  } else wrap.appendChild(el("div","muted center","Nobody enrolled yet."));

  // add from school roster
  const { data:students } = await Q.students();
  const avail=(students||[]).filter(s=>!enrolledIds.has(s.id));
  if(avail.length){
    wrap.appendChild(el("div","sec","Add from school roster"));
    avail.forEach(st=>{ const row=el("div","listrow");
      const av=el("div","avatar"); fillFace(av, st.photo_path, st.full_name);
      const body=el("div"); body.style.flex="1"; body.innerHTML=`<div class="nm">${esc(st.full_name||"(no name)")}</div>`;
      const add=el("button","btn sm","Add"); add.onclick=async()=>{ await enroll(cls.id,st.id,(enr?enr.length:0)); toast("Added"); render(); };
      row.append(av,body,add); wrap.appendChild(row);
    });
  }
}
function openStudentForm(cls){
  openSheet(sh=>{
    sh.appendChild(el("h3",null,"New student"));
    sh.appendChild(el("div","muted",`<div style="margin:-6px 0 12px;font-size:13px;line-height:1.45">You can leave the name blank for now and just add a photo — fill in names later.</div>`));
    const fn=el("div","field"); fn.innerHTML=`<label>Name (optional)</label>`; const nm=el("input"); nm.placeholder="e.g. Levi Cohen"; fn.appendChild(nm); sh.appendChild(fn);
    const fe=el("div","field"); fe.innerHTML=`<label>Their email (optional — lets them log in to see &amp; appeal)</label>`; const em=el("input"); em.type="email"; em.placeholder="student@example.com"; fe.appendChild(em); sh.appendChild(fe);
    const A=el("div","sheet-actions"); const sp=el("div"); sp.style.flex="1";
    const cn=el("button","btn ghost sm","Cancel"); cn.onclick=closeSheet;
    const sv=el("button","btn sm","Add to class");
    sv.onclick=async()=>{ try{ const st=await createStudent(nm.value.trim(), em.value.trim());
      await enroll(cls.id, st.id, 999); closeSheet(); toast("Student added"); render();
    }catch(e){ toast(e.message); } };
    A.append(sp,cn,sv); sh.appendChild(A);
  });
}
function pickFace(st){
  const inp=el("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; toast("Uploading photo…");
    try{ await uploadFace(st, f); toast("Photo saved"); render(); }catch(e){ toast(e.message); } };
  inp.click();
}

/* ===================================================================
   STUDENTS (principal) — roster + photos
   =================================================================== */
async function renderStudents(wrap){
  const add=el("button","btn","＋ New student"); add.onclick=()=>openStudentFormStandalone(); wrap.appendChild(add);
  const { data:students, error } = await Q.students();
  if(error){ wrap.appendChild(el("div","empty",esc(error.message))); return; }
  if(!students.length){ wrap.appendChild(el("div","empty","No students yet.")); return; }
  wrap.appendChild(el("div","sec","Students ("+students.length+")"));
  students.forEach(st=>{ const row=el("div","listrow");
    const av=el("div","avatar"); fillFace(av, st.photo_path, st.full_name);
    const body=el("div"); body.style.flex="1";
    body.innerHTML=`<div class="nm">${esc(st.full_name||"(no name)")}</div><div class="sub">${st.profile_id?"login linked":(st.email?"will link on signup":"no login")}</div>`;
    const cam=el("button","btn ghost sm","📷"); cam.onclick=()=>pickFace(st);
    row.append(av,body,cam); wrap.appendChild(row);
  });
}
function openStudentFormStandalone(){
  openSheet(sh=>{
    sh.appendChild(el("h3",null,"New student"));
    const fn=el("div","field"); fn.innerHTML=`<label>Name (optional)</label>`; const nm=el("input"); fn.appendChild(nm); sh.appendChild(fn);
    const fe=el("div","field"); fe.innerHTML=`<label>Email (optional)</label>`; const em=el("input"); em.type="email"; fe.appendChild(em); sh.appendChild(fe);
    const A=el("div","sheet-actions"); const sp=el("div"); sp.style.flex="1";
    const cn=el("button","btn ghost sm","Cancel"); cn.onclick=closeSheet;
    const sv=el("button","btn sm","Create");
    sv.onclick=async()=>{ try{ await createStudent(nm.value.trim(), em.value.trim()); closeSheet(); toast("Student created"); render(); }catch(e){ toast(e.message); } };
    A.append(sp,cn,sv); sh.appendChild(A);
  });
}

/* ===================================================================
   PEOPLE (principal) — assign roles
   =================================================================== */
async function renderPeople(wrap){
  wrap.appendChild(el("div","card",`<div style="font-size:13px;line-height:1.5" class="muted">Anyone who signs in appears here. Set who is a <b>teacher</b> or <b>principal</b>. Everyone else stays a student.</div>`));
  const { data:people, error } = await Q.people();
  if(error){ wrap.appendChild(el("div","empty",esc(error.message))); return; }
  wrap.appendChild(el("div","sec","People ("+people.length+")"));
  people.forEach(p=>{ const row=el("div","listrow");
    const av=el("div","avatar"); av.textContent=initials(p.full_name||p.email);
    const body=el("div"); body.style.flex="1"; body.innerHTML=`<div class="nm">${esc(p.full_name||p.email||"User")}${p.id===me_.id?' <span class="muted">(you)</span>':''}</div><div class="sub">${esc(p.email||"")}</div>`;
    const sel=el("select"); sel.style.cssText="padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:13px";
    ["student","teacher","principal"].forEach(r=>{ const o=el("option"); o.value=r; o.textContent=r; if(p.role===r)o.selected=true; sel.appendChild(o); });
    sel.onchange=async()=>{ const { error }=await setRole(p.id, sel.value); if(error){ toast(error.message); sel.value=p.role; } else { p.role=sel.value; toast("Role updated"); } };
    row.append(av,body,sel); wrap.appendChild(row);
  });
}

/* ===================================================================
   APPEALS (teacher / principal)
   =================================================================== */
async function renderAppeals(wrap){
  const { data:appeals, error } = await listAppeals();
  if(error){ wrap.appendChild(el("div","empty",esc(error.message))); return; }
  const pending=(appeals||[]).filter(a=>a.status==="pending");
  const done=(appeals||[]).filter(a=>a.status!=="pending");
  if(!appeals.length){ wrap.appendChild(el("div","empty","No appeals yet.<br>When a student disputes a mark, it shows up here.")); return; }
  wrap.appendChild(el("div","sec","Pending ("+pending.length+")"));
  if(!pending.length) wrap.appendChild(el("div","muted center","Nothing to review. 🎉"));
  pending.forEach(a=>wrap.appendChild(appealCard(a,true)));
  if(done.length){ wrap.appendChild(el("div","sec","Resolved")); done.forEach(a=>wrap.appendChild(appealCard(a,false))); }
}
function appealCard(a, actionable){
  const m=a.marks||{}; const cls=(m.classes&&m.classes.name)||"Class"; const who=(m.students&&m.students.full_name)||"Student";
  const card=el("div","card");
  card.innerHTML=`<div class="row" style="justify-content:space-between">
      <div><div style="font-weight:800">${esc(who)}</div><div class="sub muted" style="font-size:12.5px">${esc(cls)} · ${m.date?fmtDate(m.date):""}</div></div>
      <span class="pill p-${a.status}">${a.status}</span></div>
    <div style="margin:10px 0 4px"><span class="pill" style="background:#f6e9f1;color:var(--brand-dark)">marked: ${m.status?STATUS[m.status].label:"—"}</span></div>
    <div style="background:#faf2f7;border-radius:12px;padding:11px;font-size:14px;line-height:1.45;margin-top:8px">${esc(a.message||"(no reason given)")}</div>`;
  if(a.response) card.insertAdjacentHTML("beforeend",`<div style="font-size:13px;margin-top:8px"><b>Response:</b> ${esc(a.response)}</div>`);
  if(actionable){
    const acts=el("div","sheet-actions");
    const deny=el("button","btn ghost sm","Deny"); deny.onclick=()=>openResolve(a,"denied");
    const appr=el("button","btn sm","Approve & fix"); appr.style.flex="1"; appr.onclick=()=>openResolve(a,"approved");
    acts.append(deny,appr); card.appendChild(acts);
  }
  return card;
}
function openResolve(a, decision){
  openSheet(sh=>{
    const m=a.marks||{};
    sh.appendChild(el("h3",null, decision==="approved"?"Approve appeal":"Deny appeal"));
    let newStatus=m.status;
    if(decision==="approved"){
      sh.appendChild(el("div","field",`<label>Change the mark to</label>`));
      const set=el("div","statusset");
      STATUS_KEYS.forEach(k=>{ const b=el("button",(newStatus===k?"on":""),STATUS[k].label); if(newStatus===k){b.style.background=STATUS[k].color;b.style.borderColor=STATUS[k].color;}
        b.onclick=()=>{ newStatus=k; [...set.children].forEach(c=>{c.className="";c.style.background="";c.style.borderColor="";}); b.className="on"; b.style.background=STATUS[k].color; b.style.borderColor=STATUS[k].color; };
        set.appendChild(b); });
      sh.appendChild(set);
    }
    const fr=el("div","field"); fr.style.marginTop="12px"; fr.innerHTML=`<label>Note to student (optional)</label>`; const ta=el("textarea"); ta.rows=2; fr.appendChild(ta); sh.appendChild(fr);
    const A=el("div","sheet-actions"); const sp=el("div"); sp.style.flex="1";
    const cn=el("button","btn ghost sm","Cancel"); cn.onclick=closeSheet;
    const sv=el("button","btn sm",decision==="approved"?"Approve":"Deny");
    sv.onclick=async()=>{ const { error }=await resolveAppeal(a, decision, ta.value.trim(), newStatus);
      if(error){ toast(error.message); return; } closeSheet(); toast(decision==="approved"?"Approved & mark updated":"Appeal denied"); render(); };
    A.append(sp,cn,sv); sh.appendChild(A);
  });
}

/* ===================================================================
   STUDENT HOME — my attendance + appeal
   =================================================================== */
async function renderStudentHome(){
  const wrap=el("div","wrap"); app().appendChild(wrap);
  const { data:meStudent } = await Q.myStudentRow();
  if(!meStudent){ wrap.appendChild(el("div","empty","You're signed in, but not linked to a student record yet.<br>Ask your rebbe or the office to add your email to the roster.")); return; }
  wrap.appendChild(el("h2",null,`Hi, ${esc((meStudent.full_name||"").split(" ")[0]||"there")}`));
  const { data:marks } = await sb.from("marks").select("*, classes(name)").eq("student_id", meStudent.id).order("date",{ascending:false});
  const { data:myAppeals } = await sb.from("appeals").select("*").eq("student_id", meStudent.id);
  const appealByMark={}; (myAppeals||[]).forEach(a=>appealByMark[a.mark_id]=a);
  if(!marks || !marks.length){ wrap.appendChild(el("div","empty","No attendance recorded yet.")); return; }
  wrap.appendChild(el("div","sec","My attendance"));
  marks.forEach(m=>{ const row=el("div","listrow");
    const dot=el("div"); dot.style.cssText=`width:12px;height:12px;border-radius:50%;flex:none;background:${STATUS[m.status].color}`;
    const body=el("div"); body.style.flex="1";
    body.innerHTML=`<div class="nm">${esc((m.classes&&m.classes.name)||"Class")}</div><div class="sub">${fmtDate(m.date)} · ${STATUS[m.status].label}${m.minutes_late?` · ${m.minutes_late}m`:""}${m.left_early?" · left early":""}</div>`;
    row.append(dot,body);
    const ap=appealByMark[m.id];
    if(ap){ const pill=el("span","pill p-"+ap.status,ap.status); row.appendChild(pill); }
    else { const b=el("button","btn ghost sm","Appeal"); b.onclick=()=>openAppeal(m, meStudent); row.appendChild(b); }
    wrap.appendChild(row);
  });
}
function openAppeal(m, meStudent){
  openSheet(sh=>{
    sh.appendChild(el("h3",null,"Appeal this mark"));
    sh.appendChild(el("div","muted",`<div style="margin:-6px 0 12px;font-size:13px;line-height:1.45">${esc((m.classes&&m.classes.name)||"Class")} · ${fmtDate(m.date)} · marked <b>${STATUS[m.status].label}</b>.<br>Explain what happened — your rebbe will review it.</div>`));
    const fr=el("div","field"); fr.innerHTML=`<label>Your reason</label>`; const ta=el("textarea"); ta.rows=4; ta.placeholder="e.g. I was there but came in the side door…"; fr.appendChild(ta); sh.appendChild(fr);
    const A=el("div","sheet-actions"); const sp=el("div"); sp.style.flex="1";
    const cn=el("button","btn ghost sm","Cancel"); cn.onclick=closeSheet;
    const sv=el("button","btn sm","Submit appeal");
    sv.onclick=async()=>{ if(!ta.value.trim()){ toast("Add a reason"); return; }
      const { error }=await createAppeal(m.id, meStudent.id, ta.value.trim());
      if(error){ toast(error.message); return; } closeSheet(); toast("Appeal submitted"); render(); };
    A.append(sp,cn,sv); sh.appendChild(A);
  });
}

/* ===================================================================
   INIT
   =================================================================== */
async function boot(){
  if(!configured){ renderConfigNeeded(); return; }
  if(!sb){
    app().innerHTML=`<div class="splash"><div class="mark">⚠️</div><h2>Couldn't connect</h2>
      <p class="muted" style="max-width:320px;line-height:1.55">The Supabase library didn't load — check your internet connection, then reload. If it keeps happening, open <b>index.html</b> in a text editor and double-check the URL and key you pasted.</p></div>`;
    return;
  }
  // show loading so the page is never blank
  app().innerHTML=`<div class="splash"><div class="mark">ה</div><p class="muted" style="margin-top:12px">Loading…</p></div>`;
  try {
    me_ = await loadMe();
    render();
    sb.auth.onAuthStateChange(async (_e, session)=>{
      me_ = session ? await loadMe() : null;
      view = {tab:null, classId:null, sub:"mark", date:todayKey()};
      render();
    });
  } catch(e) {
    console.error(e);
    app().innerHTML=`<div class="splash"><div class="mark">⚠️</div><h2>Something went wrong</h2>
      <p class="muted" style="max-width:320px;line-height:1.55">${esc(e.message||String(e))}<br><br>
      Make sure you ran both SQL files in Supabase, and that your Project URL and anon key are correct.</p>
      <button class="btn" style="max-width:200px;margin-top:18px" onclick="location.reload()">Try again</button></div>`;
  }
}
